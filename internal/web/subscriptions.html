<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>ConfigHub 订阅</title>
<style>
body{font-family:system-ui,sans-serif;margin:2rem;color:#222}
nav a{margin-right:1rem}
table{border-collapse:collapse;margin-top:.5rem}
td,th{border:1px solid #ccc;padding:.4rem .7rem;text-align:left}
</style>
</head>
<body>
<h1>ConfigHub 订阅推送</h1>
<nav><a href="/items">配置项</a><a href="/releases">发布</a><a href="/subscriptions">订阅</a><a href="/audit">审计</a></nav>
<table id="subs"><thead><tr><th>客户端</th><th>命名空间</th><th>游标</th></tr></thead><tbody></tbody></table>
<script>
async function load(){
  const subs = await (await fetch('/api/subscriptions')).json();
  const tb = document.querySelector('#subs tbody');
  tb.innerHTML = '';
  for (const s of subs) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.client_id}</td><td>${s.namespace}</td><td>${s.cursor}</td>`;
    tb.appendChild(tr);
  }
}
load();
</script>
</body>
</html>
